#################
## Rot Compost ##
#################


# How many in-game hours vanilla rot compost must stay sealed after CompostTweak's recipe patch.
rot-compost-seal-hours: 120
 # from 1 to 720 with step of 1 (default: 120) 

# How many compost items this barrel recipe produces.
rot-compost-yield: 1
 # from 1 to 64 with step of 1 (default: 1) 


