version: 3

# Disable the creation and usage of ceramic buckets.
bucket-clay: true
 #  (default: True) 

# Disable the creation and usage of ceramic braziers.
brazier-clay: true
 #  (default: True) 

# Enable/Disable the Shelter block
persiis-shelter: false
 #  (default: False) 

# Enables Grid recipes for any assets that have
# been changed to be ground processable.
mein-kraft: false
 #  (default: False) 

# Toggle the Creative inventory stacks for liquids.
# Useful for testing or administrative operations.
liquid-creative: false
 #  (default: False) 

# Disable snowed under walkways to prevent holes in certain circumstances.
# I recommended to do this before snowing or after thawing.
walkway-snow: false
 #  (default: False) 