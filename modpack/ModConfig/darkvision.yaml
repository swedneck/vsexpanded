version: 7

# Server config enforcement
# when true settings with (Synced) will be overridden with values set by the server, values from classes, races or abilities always override server config
# when false, clients can use their own config values. does nothing in singleplayer
# useful if you want to set a general baseline for race or class mods that do not set values for darkvision or avoid unfair advantages
enforce-server-config: true # true/false default = true

# Common settings -----------------------------

adaptation-mode: ramp # (Synced) linear/ramp     linear adaptation goes from 0 to 1 linearly. ramp ramps up to a percentage of the adaptation value, then continues linearly. default = ramp
adaptation-time: 20 # (Synced) 1-600     Time (seconds) to fully adapt to darkness. default = 60
adaptation-loss-time: 15 # (Synced) 1-300    Base time (seconds) to lose adaptation from light at minimum unadaptation brightness with no multipliers. default = 30
light-sampling-rate: 200 # 100-1000     How fast should block based light calculations be run. default = 200

ramp-target-percent: 75 # (Synced) 0-100     Percent of max adaptation to reach when adaptation mode is set to ramp. Ignored if using linear. default = 60
ramp-time: 5 # (Synced) 1-600     Time (seconds) to reach ramp target. Does nothing if using linear. default = 15

max-brightness: 0.09 # (Synced) 0-1     Maximum brightness boost when reaching max adaptation. 0 is total darkness (no boost) and 1 is full bright. default = 0.2

light-source-adaptation-cap: 0.3 # (Synced) 0-1    How high adaptation can go while holding or wearing a light source. 0 = no adaptation. 1 = full adaptation.
min-held-light-level: 2 # (Synced) 0-32    Worn/held light sources emitting at or below this light level are ignored. Useful so items with very low light output don't touch adaptation

# Advanced settings ---------------------------

min-brightness-level: 8 # (Synced) 0-32     At or below this brightness level, adaptation increases. default = 5
min-unadaptation-brightness-level: 9 # (Synced) 0-32    At or above this brightness level, adaptation decreases. Has to be at least 1 > above min brightness level. default = 6
max-unadaptation-light-level: 18 # (Synced) 0-32     Maximum brightness considered for unadaptation scaling. default = 18
max-unadaptation-multiplier: 2 # (Synced) 1-50     Multiplier for how fast bright lights at the light level specified above should impact adaptation value. Scales linearly from the min brightness to max brightness. default = 5

max-desaturation-strength: 1 # (Synced) 0-1     Maximum desaturation strength 0 = off, 1 = full grayscale. default = 0.7
desat-start-light: 8 # (Synced) 0-32     At this light level or above, desaturation is 0. Desaturation is also based on the light source strength, so at dawn, even with strength 1, full desaturation won't be reached. default = 8
desat-end-light: 3 # (Synced) 0-32    At this light level, desaturation is at full strength. default = 3

close-range-start: 12 # (Synced) 1-50    Distance at which lights are considered close range. Adaptation loss by distance is 1x at this distance. default = 12
close-range-end: 2 # (Synced) 1-50     Distance at which the adaptation loss distance multiplier becomes maximum. default = 2
close-range-multiplier: 4 # (Synced) 1-50    Multiplier for close light sources. Consider that this multiplier also multiplies the unadaptation one. default = 4

sun-light-compensation: 4 # (Synced) 0-10     Reduces sunlight value that is passed onto calculations. Used to compensate sunlight readings at night. default = 5
# Longer explaination: for whatever reason at night sunlight value can get to about 4-8 but the environment will still be very dark.
# This compensates that reading while not influencing dawn and dusk.

# Visual effects ---------------------------

exposure-lag: 5 # 0-30     Exposure timer. Controls the duration of the exposure effect when coming out of darkness into light. 0 disables it. default = 7
max-exposure-at-adaptation: 0.5 # 0-1    Adaptation value at which the exposure time reaches maximum. default = 0.5
exposure-multiplier: 2 # 0-2     Multiplier for the exposure effect, controls how strong it is. 0 disables it. default = 1
streaks-intensity: 1 # 0-2      Controls how strong light streaks coming from light sources are. Set to 0 to disable. default = 1
streaks-length: 0.5 # 0-2       Controls how long the light streaks are. default = 0.5

# Raycast detection ---------------------------
# Calculates through raycasting how distant you are from a light source that is seen and applies a multiplier to your unadaptation value.

enable-raycast-detection: true # true/false    Enable look based light detection. default = true
raycast-preset: normal # normal/high    normal = two pass 5x3 grid, narrow and accurate enough up to 50 blocks. high = three pass 7x5 grid, wider and accurate up to 80 blocks. Can be expensive if raycast distance is high. default = normal
raycast-update-interval: 500 # 100-2000     How fast the raycast should tick in milliseconds. default = 500
raycast-max-distance: 40 # 5-128    Maximum raycast distance. How far you will "see" lights. Adaptation loss falloff is 0x at this distance. Can be expensive if high values are used. default = 40

# Dynamic lights ---------------------------
# Detects nearby dynamic light sources based on FOV and line of sight.
# Has an internal priority system. Lights are prioritized and checked based on distance and light intensity.

enable-dynamic-light-detection: true # true/false    Enable the dynamic light detection system. default = true
dynamic-lights-max-rings: 18 # 1-30    How many rings (max circle radius) to generate around the light source for detection. Dynamic lights fall off linearly. default = 18
dynamic-lights-update-interval: 500 # 200-2000     How fast should the game check for dynamic light sources in milliseconds. default = 500
dynamic-lights-max-sources: 5 # 1-20    Maximum number of light sources to check per run. Multiple light sources are checked usually only if they are completely occluded. default = 5
dynamic-lights-distant-threshold: 25 # 10-50    At which distance from closest light source the mod switches to using a less performance expensive LOS check. default = 25
dynamic-lights-distant-max-rings: 8 # 1-30   How many rings (max circle radius) to generate around the light source past the threshold distance. default = 8
dynamic-lights-scan-horizontal-radius: 40 # 5-80    Horizontal radius around the player to scan for light sources. default = 40
dynamic-lights-scan-vertical-radius: 20 # 5-60    Vertical radius around the player to scan for light sources. default = 20
dynamic-lights-view-cone-fov: 160 # 60-360    Field of view cone in degrees for light detection. default = 160
dynamic-lights-full-fov-distance: 7 # 1-20    If you are closer to a dynamic light than this value, FOV check is ignored. Used to disable adaptation if you are looking away from a dynamic light but inside its light radius. default = 7

# Experimental ---------------------------

enable-sky-check: false # (Synced) true/false      Raycasts above the player for sunlight and collision. If the raycast hits a ceiling AND has sampled no sunlight, brings adaptation to 0 using deadaptation time. default = false
sky-check-max-distance: 50 # (Synced) 10-200            How far to raycast upwards to look for collisions to determine if the player is under the sky. If it hits no blocks, will assume you are under the sky. default = 50
sky-check-min-sunlight: 0 # (Synced) 0-24      If sampled sunlight is at or below this value and you are under a block, adaptation is disabled. default = 0

# Misc ---------------------------
# Blocks the raycaster and dynamic light system should treat as transparent (Synced)
# Comma separated, partial matches. Put transparent or non *full* blocks here. Use dev mode to determine block names.
transparent-blocks: leaves, glass, clutter, tallgrass, water, fern, flower, tallplant, mushroom, wildvine, bush, fence, beam, coral, snowlayer, groundstorage, loosestones, looseflints, looseboulders,
