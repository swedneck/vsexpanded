version: 1

# Toggle rare oak trees spawning in cold climates (in temperatures from 2 to -18).
oak-gen: true
 #  (default: True) 

# Toggle flint being able to spawn in all rock types (otherwise finding starting rocks can be quite difficult if you spawn in an area with non-sedimentary rocks, since surface rocks don't spawn in cold climates).
flint-gen: true
 #  (default: True) 

# Toggle mudbricks being craftable from barren soil.
mudbrick: true
 #  (default: True) 

# Toggle the removal of the -14C minimum temperature from trader spawns
traders: true
 #  (default: True) 

# Set the minimum temperature at which muddy gravel spawns in lakes/rives. Default is -18, vanilla is -2.
muddy-temp: -18
 # from -60 to -2 (default: -18) 

# Set the minimum temperature at which horsetails spawn. Default is -15, vanilla is 1.
horsetail-temp: -15
 # from -60 to 1 (default: -15) 

# Set the minimum temperature at which flax spawns. Default is -2, vanilla is 1.
flax-temp: -2
 # from -60 to 1 (default: -2) 

# Set the minimum temperature at which elk spawn. Default is -18, vanilla is -14.
elk-temp: -18
 # from -60 to -14 (default: -18) 

# Set the minimum temperature at which wild beehives spawn. Default is -15, vanilla is 5.
bee-temp: -15
 # from -60 to 5 (default: -15) 

# Set the minimum temperature at which hornwort, muskgrass, milfoil, watercrowfoot, sea lace, irish moss, and bladderwrack spawn. Default is -20, vanilla is -10.
aquatic-temp: -20
 # from -60 to -10 (default: -20) 

# Set the minimum temperature at which seaweed spawns. Default is -20, vanilla is -6.
seaweed-temp: -20
 # from -60 to -6 (default: -20) 


########################################
## Clouydberry and Raspberry Settings ##
########################################


# Toggle raspberry patches being able to spawn on barren soil.
raspberry-fertility: true
 #  (default: True) 

# Set the temperature at which cloudberry and raspberry bushes pause growth. Default is -4, vanilla is 4.
berries-pause: -4
 # from -60 to 4 (default: -4) 

# Set the temperature at which cloudberry and raspberry bushes reset their growing progress. Default is -9, vanilla is -3.
berries-reset: -9
 # from -60 to -3 (default: -9) 

# Set the temperature at which cloudberry and raspberry bushes go dormant. Should be set lower than the 'leave dormant' temperature. Default is -14, vanilla is -5.
berries-godormant: -14
 # from -60 to -5 (default: -14) 

# Set the temperature at which cloudberry and raspberry bushes leave dormancy. Should be set higher than the 'go dormant' temperature. Default is 4, vanilla is 15.
berries-leavedormant: 4
 # from -60 to 15 (default: 4) 


###################
## Peat Settings ##
###################


# Toggle peat patches being allowed to spawn in barren soil.
peat-gen: true
 #  (default: True) 

# Set the minimum temperature at which peat patches spawn. Default is -25, vanilla is 1.
peat-temp: -25
 # from -60 to 1 (default: -25) 


###################
## Clay Settings ##
###################


# Toggle clay patches being allowed to spawn in barren soil.
clay-gen: true
 #  (default: True) 

# Set the minimum temperature at which clay patches spawn. Default is -25, vanilla is -10.
clay-temp: -25
 # from -60 to -10 (default: -25) 


###################
## Reed Settings ##
###################


# Set the minimum temperature at which reeds spawn. Default is -20, vanilla is -6.
reeds-temp: -18
 # from -60 to 3 (default: -18) 

# Set the temperature at which reeds stop growing. Default is -4, vanilla is 3.
reeds-stop: -4
 # from -60 to 2 (default: -4) 

# Set the temperature at which reeds reset their growing progress. Default is -9, vanilla is -4.
reeds-reset: -9
 # from -60 to -4 (default: -9) 


#######################
## Mushroom Settings ##
#######################


# Toggle mushrooms that can already spawn in cold climates being able to spawn under any tree types instead of just decidious.
mushroom-tree: true
 #  (default: True) 

# Toggle patches that increase the chances of cold climate mushrooms spawning. Includes mushrooms that are cold climate by default and also mushrooms that are set to cold climate below.
mushroom-chance: true
 #  (default: True) 

# Set the minimum temperature at which earthballs spawn. Default is -15, vanilla is -3.
mush-temp-earthball: -15
 # from -60 to -3 (default: -15) 

# Set the minimum temperature at which puffballs spawn. Default is -15, vanilla is -3.
mush-temp-puffball: -15
 # from -60 to -3 (default: -15) 

# Set the minimum temperature at which chanterelles spawn. Default is -15, vanilla is -1.
mush-temp-chanterelle: -15
 # from -60 to -1 (default: -15) 

# Set the minimum temperature at which king boletes spawn. Default is -15, vanilla is -5.
mush-temp-kingbolete: -15
 # from -60 to -5 (default: -15) 

# Set the minimum temperature at which common morels spawn. Default is -15, vanilla is -1.
mush-temp-morel: -15
 # from -60 to -1 (default: -15) 


############################################
## Salt And Sands Settings (If Installed) ##
############################################


# Set the minimum temperature at which scallops and clams spawn in salt water. Default is -18, vanilla is -7.
salt-bivalve-temp: -18
 # from -60 to -7 (default: -18) 

# Set the minimum temperature at which freshwater mussels spawn. Default is -18, vanilla is -4.
fresh-bivalve-temp: -18
 # from -60 to -4 (default: -18) 