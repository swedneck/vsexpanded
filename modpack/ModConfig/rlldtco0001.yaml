version: 7


#################
## Rot Compost ##
#################


# How many in-game hours vanilla rot compost must stay sealed after CompostTweak's recipe patch.
rot-compost-seal-hours: 240
 # from 1 to 720 with step of 1 (default: 240) 

# How many litres of rot are consumed per compost batch. Increase this to get less compost from a stack.
rot-compost-input-litres: 2
 # from 1 to 64 with step of 1 (default: 2) 

# How many compost items this barrel recipe produces per completed batch.
rot-compost-yield: 1
 # from 1 to 64 with step of 1 (default: 1) 


