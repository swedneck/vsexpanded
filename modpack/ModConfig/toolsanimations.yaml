version: 1
axe_animation: true
 #  (default: True) 
pickaxe_animation: true
 #  (default: True) 
axe_twohanded: true
 #  (default: False) 
pickaxe_twohanded: true
 #  (default: False) 
tool_rendering_offset: false
 #  (default: True) 
axe_can_split_logs: true
 #  (default: True) 
tool_whoosh_sound: 0.5
 # from 0 to 1 (default: 0.5) 

# Animation speed bonus from mining speed bonus of a pickaxe. Makes higher tier pickaxes swing faster. Value of 0.3 means +30% animation speed for steel piackaxe.
tool_animation_speed_bonus: 0.3
 # from 0 to 1.5 (default: 0.3) 

# Beyond this range mining speed will lineraly reduce to a mining speed at maximum range
pickaxe_optimal_range: 2.5
 # from 0 to 4.5 (default: 2.5) 

# Mining speed factor at maximum interaction range of 4.5 blocks
pickaxe_speed_at_max_range: 0.5
 # from 0 to 1 (default: 0.5) 
pickaxe_damage_on_hit: false
 #  (default: False) 
pickaxe_chance_to_damage_on_hit: 0.5
 # from 0 to 1 (default: 0.5) 
pickaxe_durability_factor: 1
 # from 0.1 to 10 (default: 1) 